    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>If you have any questions or collaboration proposals, feel free to fill out the form below or reach me directly at <strong>edcelsidchayao@gmail.com</strong>.</p>
            
            <form action="#" method="POST">
                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </p>

                <p>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject" placeholder="Subject of your message">
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="30" required placeholder="Type your message here..."></textarea>
                </p>

                <p>
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </p>
            </form>
        </section>
    </main>
